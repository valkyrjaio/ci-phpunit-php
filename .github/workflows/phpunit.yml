name: PHPUnit

on:
  push:
    branches: [ 'master', '*.x' ]
  pull_request:
    branches: [ 'master', '*.x' ]

jobs:
  phpunit:
    name: PHPUnit
    uses: ./.github/workflows/_workflow-call.yml
    permissions:
      pull-requests: write
      contents: read
    with:
      php-versions: '["8.4", "8.5", "8.6"]'
      php-version-bleeding-edge: '8.6'
      extensions: 'mbstring, intl'
      paths: |
        ci:
          - '.github/ci/phpunit/**'
          - '.github/workflows/phpunit.yml'
          - '.github/workflows/_workflow-call.yml'
        files:
          - '.github/ci/phpunit/**'
          - '.github/workflows/phpunit.yml'
          - '.github/workflows/_workflow-call.yml'
          - 'src/**/*.php'
          - 'tests/**/*.php'
          - 'composer.json'
